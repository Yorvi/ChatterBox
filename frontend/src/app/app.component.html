<mat-toolbar color="primary">
  <span class="brand" routerLink="/timeline">ChatterBox</span>
  @if (auth.isLoggedIn()) {
    <nav class="nav-links">
      <a mat-button routerLink="/timeline">Timeline</a>
      <a mat-button routerLink="/friends">Friends</a>
      <a mat-button routerLink="/messages">Messages</a>
    </nav>
  }
  <span class="spacer"></span>
  @if (auth.isLoggedIn()) {
    <a class="profile-link" [routerLink]="['/profile', auth.currentUser()?.id]">
      <app-avatar
        [username]="auth.currentUser()?.username ?? ''"
        [photoUrl]="auth.currentUser()?.profilePhoto"
        [size]="28"
      ></app-avatar>
      <span class="username">{{ auth.currentUser()?.username }}</span>
    </a>
    <button mat-icon-button (click)="auth.logout()" aria-label="Log out">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<router-outlet></router-outlet>
